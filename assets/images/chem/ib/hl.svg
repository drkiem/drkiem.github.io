<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Silver Gradient for AP/SAT cards -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- IBO Logo Gradient -->
    <radialGradient id="ibLogoGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="70%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>

    <!-- Card Clipping Shape for Banner -->
    <clipPath id="cardClip">
      <rect x="0" y="0" width="800" height="450" rx="24"/>
    </clipPath>

    <!-- Technical Grid Pattern -->
    <pattern id="lightGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 0, 0, 0.03)" stroke-width="0.8"/>
    </pattern>

    <!-- Glow filter for curves -->
    <filter id="glow-dark" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="context-stroke" />
    </marker>
    
  </defs>

  <!-- Card Background -->
  <rect width="800" height="450" rx="24" fill="#EFE5D9" stroke="rgba(0,0,0,0.06)" stroke-width="2"/>
  <rect width="800" height="450" rx="24" fill="url(#lightGrid)"/>

  <!-- Logo Placement -->
  
    <g transform="translate(108, 400)">
      <circle cx="0" cy="0" r="23" fill="none" stroke="#1E40AF" stroke-width="1" opacity="0.4"/>
      <circle cx="0" cy="0" r="20" fill="url(#ibLogoGrad)"/>
      <text x="-1.5" y="7" font-family="'Georgia', serif" font-style="italic" font-weight="bold" font-size="22" fill="#FFFFFF" text-anchor="middle">ib</text>
      <circle cx="0" cy="0" r="21.5" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-dasharray="1,2" opacity="0.6"/>
      <text x="32" y="9" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="26" fill="#1E293B" letter-spacing="0.5">IBO</text>
    </g>
    

  <!-- AP/SAT Badges -->
  

  <!-- Left Content Panel -->
  <g transform="translate(60, 0)">
    <!-- Title Line 1 -->
    <text x="0" y="140" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#000000" letter-spacing="-1">IB Chemistry (HL)</text>
    
    <!-- Title Line 2 -->
    <text x="0" y="210" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="38" fill="#000000" letter-spacing="-0.5">Higher Level</text>
    
    <!-- Subtitle (Curriculum name / Board / Level) -->
    <text x="0" y="260" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="20" fill="#334155" letter-spacing="-0.2">Structure &amp; Reactivity</text>
  </g>

  <!-- Right Illustration Panel -->
  <g transform="translate(0, 0)">
    
        <!-- Octahedral complex & hybrid orbitals -->
        <g transform="translate(460, 205)">
          <line x1="0" y1="0" x2="-40" y2="-40" stroke="rgba(0,0,0,0.3)" stroke-dasharray="3,3" stroke-width="2"/>
          <line x1="0" y1="0" x2="60" y2="-30" stroke="rgba(0,0,0,0.3)" stroke-dasharray="3,3" stroke-width="2"/>
          <line x1="0" y1="-80" x2="0" y2="80" stroke="rgba(0,0,0,0.4)" stroke-width="2"/>
          
          <polygon points="0,0 -30,45 -40,40" fill="#065F46" opacity="0.8"/>
          <polygon points="0,0 50,40 40,46" fill="#065F46" opacity="0.8"/>
          
          <circle cx="0" cy="0" r="16" fill="#065F46" stroke="#EFE5D9" stroke-width="2" />
          <text x="0" y="4.5" font-family="'Inter', sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">Fe</text>
          
          <text x="0" y="-88" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#334155" text-anchor="middle">H₂O</text>
          <text x="0" y="96" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#334155" text-anchor="middle">H₂O</text>
          <text x="-50" y="-45" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#475569" text-anchor="end">H₂O</text>
          <text x="72" y="-30" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#475569" text-anchor="start">H₂O</text>
        </g>
        
        <!-- Orbital splitting -->
        <g transform="translate(615, 140)" stroke="#065F46" stroke-width="2" fill="none">
          <line x1="20" y1="20" x2="55" y2="20" filter="url(#glow-dark)"/>
          <line x1="65" y1="20" x2="100" y2="20" filter="url(#glow-dark)"/>
          <text x="110" y="24" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#000000" stroke="none">e_g</text>
          
          <line x1="15" y1="90" x2="42" y2="90" />
          <line x1="48" y1="90" x2="75" y2="90" />
          <line x1="81" y1="90" x2="108" y2="90" />
          <text x="115" y="94" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#475569" stroke="none">t_2g</text>
          
          <path d="M 60 80 L 60 30" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow)"/>
          <text x="48" y="58" font-family="'Inter', sans-serif" font-size="12" fill="#10B981" stroke="none" font-weight="bold">Δ</text>
        </g>
        
  </g>

  <!-- Desmos Logo overlay -->
  

  <!-- Bottom-Right Banner clipped by card rounded corner -->
  <g clip-path="url(#cardClip)">
    <path d="M 370,450 L 370,380 C 370,362 385,348 402,348 L 800,348 L 800,450 Z" fill="#374151"/>
    <text x="590" y="408" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="23" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.2">Structure &amp; Reactivity</text>
  </g>
</svg>