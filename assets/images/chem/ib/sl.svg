<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Silver Gradient for AP/SAT cards -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- IBO Logo Gradient -->
    <radialGradient id="ibLogoGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="70%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>

    <!-- Card Clipping Shape for Banner -->
    <clipPath id="cardClip">
      <rect x="0" y="0" width="800" height="450" rx="24"/>
    </clipPath>

    <!-- Technical Grid Pattern -->
    <pattern id="lightGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 0, 0, 0.03)" stroke-width="0.8"/>
    </pattern>

    <!-- Glow filter for curves -->
    <filter id="glow-dark" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="context-stroke" />
    </marker>
    
  </defs>

  <!-- Card Background -->
  <rect width="800" height="450" rx="24" fill="#EFE5D9" stroke="rgba(0,0,0,0.06)" stroke-width="2"/>
  <rect width="800" height="450" rx="24" fill="url(#lightGrid)"/>

  <!-- Logo Placement -->
  
    <g transform="translate(108, 400)">
      <circle cx="0" cy="0" r="23" fill="none" stroke="#1E40AF" stroke-width="1" opacity="0.4"/>
      <circle cx="0" cy="0" r="20" fill="url(#ibLogoGrad)"/>
      <text x="-1.5" y="7" font-family="'Georgia', serif" font-style="italic" font-weight="bold" font-size="22" fill="#FFFFFF" text-anchor="middle">ib</text>
      <circle cx="0" cy="0" r="21.5" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-dasharray="1,2" opacity="0.6"/>
      <text x="32" y="9" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="26" fill="#1E293B" letter-spacing="0.5">IBO</text>
    </g>
    

  <!-- AP/SAT Badges -->
  

  <!-- Left Content Panel -->
  <g transform="translate(60, 0)">
    <!-- Title Line 1 -->
    <text x="0" y="140" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#000000" letter-spacing="-1">IB Chemistry (SL)</text>
    
    <!-- Title Line 2 -->
    <text x="0" y="210" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="38" fill="#000000" letter-spacing="-0.5">Standard Level</text>
    
    <!-- Subtitle (Curriculum name / Board / Level) -->
    <text x="0" y="260" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="20" fill="#334155" letter-spacing="-0.2">Structure &amp; Reactivity</text>
  </g>

  <!-- Right Illustration Panel -->
  <g transform="translate(0, 0)">
    
        <!-- Simple Voltaic Cell -->
        <g transform="translate(420, 150)">
          <!-- Beakers -->
          <rect x="0" y="40" width="85" height="100" rx="4" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="2"/>
          <path d="M 2 75 L 83 75 L 83 138 L 2 138 Z" fill="rgba(16, 185, 129, 0.15)"/>
          <rect x="25" y="15" width="18" height="80" fill="#065F46"/>
          
          <rect x="175" y="40" width="85" height="100" rx="4" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="2"/>
          <path d="M 177 75 L 258 75 L 258 138 L 177 138 Z" fill="rgba(6, 95, 70, 0.1)"/>
          <rect x="210" y="15" width="18" height="80" fill="#047857"/>
          
          <!-- Salt Bridge -->
          <path d="M 60 55 L 60 25 L 195 25 L 195 55" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="12" stroke-linejoin="round"/>
          <path d="M 60 55 L 60 25 L 195 25 L 195 55" fill="none" stroke="#EFE5D9" stroke-width="6" stroke-linejoin="round"/>
          
          <!-- Wire & Meter -->
          <path d="M 34 15 L 34 -15 L 220 -15 L 220 15" fill="none" stroke="#065F46" stroke-width="2" filter="url(#glow-dark)"/>
          <circle cx="127" cy="-15" r="14" fill="#EFE5D9" stroke="#065F46" stroke-width="2" />
          <text x="127" y="-10" font-family="'Inter', sans-serif" font-weight="900" font-size="12" fill="#000000" text-anchor="middle">V</text>
          
          <text x="-15" y="90" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#475569">Zn</text>
          <text x="275" y="90" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#475569">Cu</text>
        </g>
        
  </g>

  <!-- Desmos Logo overlay -->
  

  <!-- Bottom-Right Banner clipped by card rounded corner -->
  <g clip-path="url(#cardClip)">
    <path d="M 370,450 L 370,380 C 370,362 385,348 402,348 L 800,348 L 800,450 Z" fill="#374151"/>
    <text x="590" y="408" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="23" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.2">Structure &amp; Reactivity</text>
  </g>
</svg>