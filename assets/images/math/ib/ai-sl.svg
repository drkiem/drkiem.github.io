<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Silver Gradient for AP/SAT cards -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- IBO Logo Gradient -->
    <radialGradient id="ibLogoGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="70%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>

    <!-- Card Clipping Shape for Banner -->
    <clipPath id="cardClip">
      <rect x="0" y="0" width="800" height="450" rx="24"/>
    </clipPath>

    <!-- Technical Grid Pattern -->
    <pattern id="lightGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 0, 0, 0.03)" stroke-width="0.8"/>
    </pattern>

    <!-- Glow filter for curves -->
    <filter id="glow-dark" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="context-stroke" />
    </marker>
    
  </defs>

  <!-- Card Background -->
  <rect width="800" height="450" rx="24" fill="#D2D7DF" stroke="rgba(0,0,0,0.06)" stroke-width="2"/>
  <rect width="800" height="450" rx="24" fill="url(#lightGrid)"/>

  <!-- Logo Placement -->
  
    <g transform="translate(108, 400)">
      <circle cx="0" cy="0" r="23" fill="none" stroke="#1E40AF" stroke-width="1" opacity="0.4"/>
      <circle cx="0" cy="0" r="20" fill="url(#ibLogoGrad)"/>
      <text x="-1.5" y="7" font-family="'Georgia', serif" font-style="italic" font-weight="bold" font-size="22" fill="#FFFFFF" text-anchor="middle">ib</text>
      <circle cx="0" cy="0" r="21.5" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-dasharray="1,2" opacity="0.6"/>
      <text x="32" y="9" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="26" fill="#1E293B" letter-spacing="0.5">IBO</text>
    </g>
    

  <!-- AP/SAT Badges -->
  

  <!-- Left Content Panel -->
  <g transform="translate(60, 0)">
    <!-- Title Line 1 -->
    <text x="0" y="140" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#000000" letter-spacing="-1">IB Mathematics</text>
    
    <!-- Title Line 2 -->
    <text x="0" y="210" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="38" fill="#000000" letter-spacing="-0.5">AI (SL)</text>
    
    <!-- Subtitle (Curriculum name / Board / Level) -->
    <text x="0" y="260" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="20" fill="#334155" letter-spacing="-0.2">Standard Level</text>
  </g>

  <!-- Right Illustration Panel -->
  <g transform="translate(0, 0)">
    
        <!-- Voronoi cell & Chi-Square graph -->
        <g stroke="rgba(0,0,0,0.18)" stroke-width="1.5" fill="none" transform="translate(380, 95)">
          <polygon points="10,40 70,10 110,50 80,100 20,80" />
          <polygon points="70,10 150,0 170,55 110,50" />
          <polygon points="110,50 170,55 150,120 80,100" />
          
          <circle cx="55" cy="55" r="4.5" fill="#1E3A8A" stroke="none"/>
          <circle cx="125" cy="25" r="4.5" fill="#1E3A8A" stroke="none"/>
          <circle cx="130" cy="80" r="4.5" fill="#1E3A8A" stroke="none"/>
        </g>
        
        <!-- Chi-Square Curve (Pole X=480, Y=160) -->
        <g transform="translate(480, 160)" stroke="none" fill="none">
          <line x1="0" y1="130" x2="210" y2="130" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/>
          <line x1="20" y1="20" x2="20" y2="135" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/>
          
          <!-- Critical Shaded region -->
          <path d="M 130 98 L 130 130 L 190 130 L 190 125 C 170 120, 150 110, 130 98 Z" fill="rgba(220,38,38,0.2)" stroke="#DC2626" stroke-width="1"/>
          
          <!-- Curve -->
          <path d="M 20 130 Q 40 30 70 50 T 130 98 T 195 125" fill="none" stroke="#1E3A8A" stroke-width="3" filter="url(#glow-dark)"/>
          
          <line x1="130" y1="75" x2="130" y2="130" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="2,2"/>
          <text x="130" y="65" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#DC2626" text-anchor="middle">critical</text>
        </g>
        
  </g>

  <!-- Desmos Logo overlay -->
  
  <!-- Desmos green logo -->
  <g transform="translate(685, 275)">
    <rect x="0" y="0" width="55" height="55" rx="13" fill="#1A7F37" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <path d="M 12 15 C 20 40, 35 40, 43 15" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 10 35 Q 20 22, 27.5 35 T 45 35" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <text x="27.5" y="48" font-family="'Inter', sans-serif" font-weight="900" font-size="6.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.2">desmos</text>
  </g>


  <!-- Bottom-Right Banner clipped by card rounded corner -->
  <g clip-path="url(#cardClip)">
    <path d="M 370,450 L 370,380 C 370,362 385,348 402,348 L 800,348 L 800,450 Z" fill="#3B0A45"/>
    <text x="590" y="408" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="23" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.2">Applications &amp; Interpretation</text>
  </g>
</svg>