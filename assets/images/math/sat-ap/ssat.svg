<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Silver Gradient for AP/SAT cards -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- IBO Logo Gradient -->
    <radialGradient id="ibLogoGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="70%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>

    <!-- Card Clipping Shape for Banner -->
    <clipPath id="cardClip">
      <rect x="0" y="0" width="800" height="450" rx="24"/>
    </clipPath>

    <!-- Technical Grid Pattern -->
    <pattern id="lightGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 0, 0, 0.03)" stroke-width="0.8"/>
    </pattern>

    <!-- Glow filter for curves -->
    <filter id="glow-dark" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="context-stroke" />
    </marker>
    
  </defs>

  <!-- Card Background -->
  <rect width="800" height="450" rx="24" fill="url(#silverGrad)" stroke="rgba(0,0,0,0.06)" stroke-width="2"/>
  <rect width="800" height="450" rx="24" fill="url(#lightGrid)"/>

  <!-- Logo Placement -->
  
    <g transform="translate(70, 395)">
      <path d="M -8,0 C -8,-2.5 -4.5,-4.5 0,-4.5 C 4.5,-4.5 8,-2.5 8,0 C 8,1.5 4.5,2.5 0,2.5 C -4.5,2.5 -8,1.5 -8,0 Z" fill="#475569"/>
      <path d="M -8,0 C -8,-5 -4.5,-9.5 0,-9.5 C 4.5,-9.5 8,-5 8,0 C 8,5.5 1.5,10.5 0,11.5 C -1.5,10.5 -8,5.5 -8,0 Z" fill="#1E293B" stroke="#FFFFFF" stroke-width="0.5"/>
      <path d="M -8,0 C -8,-2.5 -4.5,-4.5 0,-4.5 C 4.5,-4.5 8,-2.5 8,0 C 8,1.5 4.5,2.5 0,2.5 C -4.5,2.5 -8,1.5 -8,0 Z" fill="#475569" stroke="#FFFFFF" stroke-width="0.5"/>
      <path d="M 0,-9.5 L 0,-13" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
      <text x="16" y="8" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="20" fill="#1E293B" letter-spacing="-0.8">College Board</text>
    </g>
    

  <!-- AP/SAT Badges -->
  

  <!-- Left Content Panel -->
  <g transform="translate(60, 0)">
    <!-- Title Line 1 -->
    <text x="0" y="140" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#000000" letter-spacing="-1">SSAT Prep</text>
    
    <!-- Title Line 2 -->
    <text x="0" y="210" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="38" fill="#000000" letter-spacing="-0.5">Mathematics</text>
    
    <!-- Subtitle (Curriculum name / Board / Level) -->
    <text x="0" y="260" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="20" fill="#334155" letter-spacing="-0.2">Quantitative &amp; Logic</text>
  </g>

  <!-- Right Illustration Panel -->
  <g transform="translate(0, 0)">
    
        <!-- Pie chart percentage & logical patterns -->
        <g transform="translate(430, 185)">
          <path d="M 0 0 L 0 -55 A 55 55 0 0 1 0 55 Z" fill="rgba(239, 68, 68, 0.12)" stroke="#450A0A" stroke-width="2" filter="url(#glow-dark)"/>
          <path d="M 0 0 L 0 55 A 55 55 0 0 1 -52 -17 Z" fill="rgba(0, 0, 0, 0.05)" stroke="rgba(0,0,0,0.4)" stroke-width="1.5"/>
          <path d="M 0 0 L -52 -17 A 55 55 0 0 1 0 -55 Z" fill="rgba(220,38,38,0.1)" stroke="#DC2626" stroke-dasharray="2,2" stroke-width="1.2"/>
          
          <text x="22" y="5" font-family="'Inter', sans-serif" font-weight="bold" font-size="11" fill="#000000">50%</text>
        </g>
        
        <g transform="translate(585, 145)" stroke="rgba(0,0,0,0.3)" stroke-width="1.5" fill="none">
          <polygon points="0,22 18,-8 36,22" stroke="#450A0A" stroke-width="2.5" filter="url(#glow-dark)"/>
          <text x="18" y="36" font-family="'Inter', sans-serif" font-size="9" fill="#475569" stroke="none" text-anchor="middle">3 sides</text>
          
          <rect x="60" y="-8" width="30" height="30" />
          <text x="75" y="36" font-family="'Inter', sans-serif" font-size="9" fill="#475569" stroke="none" text-anchor="middle">4 sides</text>
          
          <text x="45" y="80" font-family="'Courier New', monospace" font-weight="bold" font-size="16" fill="#000000" stroke="none" text-anchor="middle">2, 5, 10, 17, [?]</text>
        </g>
        
  </g>

  <!-- Desmos Logo overlay -->
  

  <!-- Bottom-Right Banner clipped by card rounded corner -->
  <g clip-path="url(#cardClip)">
    <path d="M 370,450 L 370,380 C 370,362 385,348 402,348 L 800,348 L 800,450 Z" fill="#000000"/>
    <text x="590" y="408" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="23" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.2">Ratios &amp; Sequences</text>
  </g>
</svg>