<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Silver Gradient for AP/SAT cards -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- IBO Logo Gradient -->
    <radialGradient id="ibLogoGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="70%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>

    <!-- Card Clipping Shape for Banner -->
    <clipPath id="cardClip">
      <rect x="0" y="0" width="800" height="450" rx="24"/>
    </clipPath>

    <!-- Technical Grid Pattern -->
    <pattern id="lightGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 0, 0, 0.03)" stroke-width="0.8"/>
    </pattern>

    <!-- Glow filter for curves -->
    <filter id="glow-dark" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="context-stroke" />
    </marker>
    
  </defs>

  <!-- Card Background -->
  <rect width="800" height="450" rx="24" fill="url(#silverGrad)" stroke="rgba(0,0,0,0.06)" stroke-width="2"/>
  <rect width="800" height="450" rx="24" fill="url(#lightGrid)"/>

  <!-- Logo Placement -->
  
    <g transform="translate(70, 395)">
      <path d="M -8,0 C -8,-2.5 -4.5,-4.5 0,-4.5 C 4.5,-4.5 8,-2.5 8,0 C 8,1.5 4.5,2.5 0,2.5 C -4.5,2.5 -8,1.5 -8,0 Z" fill="#475569"/>
      <path d="M -8,0 C -8,-5 -4.5,-9.5 0,-9.5 C 4.5,-9.5 8,-5 8,0 C 8,5.5 1.5,10.5 0,11.5 C -1.5,10.5 -8,5.5 -8,0 Z" fill="#1E293B" stroke="#FFFFFF" stroke-width="0.5"/>
      <path d="M -8,0 C -8,-2.5 -4.5,-4.5 0,-4.5 C 4.5,-4.5 8,-2.5 8,0 C 8,1.5 4.5,2.5 0,2.5 C -4.5,2.5 -8,1.5 -8,0 Z" fill="#475569" stroke="#FFFFFF" stroke-width="0.5"/>
      <path d="M 0,-9.5 L 0,-13" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
      <text x="16" y="8" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="20" fill="#1E293B" letter-spacing="-0.8">College Board</text>
    </g>
    

  <!-- AP/SAT Badges -->
  
  <!-- AP and SAT shields in top right -->
  <g transform="translate(680, 50)">
    <g transform="translate(-40, 0)">
      <path d="M -15,-15 L 15,-15 L 15,2 C 15,9 8,16 0,20 C -8,16 -15,9 -15,2 Z" fill="#FFFFFF" stroke="#0079C1" stroke-width="1.5"/>
      <path d="M -13,-13 L 13,-13 L 13,2 C 13,8.5 6.5,14.5 0,18.5 C -6.5,14.5 -13,8.5 -13,2 Z" fill="#0079C1" opacity="0.1"/>
      <text x="0" y="4" font-family="'Inter', sans-serif" font-weight="900" font-size="13" fill="#0079C1" text-anchor="middle">AP</text>
    </g>
    <g transform="translate(0, 0)">
      <path d="M -15,-15 L 15,-15 L 15,2 C 15,9 8,16 0,20 C -8,16 -15,9 -15,2 Z" fill="#0079C1" stroke="#0079C1" stroke-width="1.5"/>
      <text x="0" y="4" font-family="'Inter', sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle">SAT</text>
    </g>
  </g>


  <!-- Left Content Panel -->
  <g transform="translate(60, 0)">
    <!-- Title Line 1 -->
    <text x="0" y="140" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#000000" letter-spacing="-1">AP Calculus</text>
    
    <!-- Title Line 2 -->
    <text x="0" y="210" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="38" fill="#000000" letter-spacing="-0.5">AB &amp; BC</text>
    
    <!-- Subtitle (Curriculum name / Board / Level) -->
    <text x="0" y="260" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="20" fill="#334155" letter-spacing="-0.2">College Board AP</text>
  </g>

  <!-- Right Illustration Panel -->
  <g transform="translate(0, 0)">
    
        <!-- Solids of Revolution -->
        <g stroke="rgba(0,0,0,0.08)" stroke-width="1" transform="translate(-20, 0)">
          <line x1="380" y1="220" x2="680" y2="220" />
          <line x1="430" y1="80" x2="430" y2="330" />
        </g>
        
        <ellipse cx="550" cy="220" rx="14" ry="38" fill="rgba(239, 68, 68, 0.12)" stroke="#450A0A" stroke-width="1.5" filter="url(#glow-dark)"/>
        <ellipse cx="610" cy="220" rx="9" ry="30" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="1.5"/>
        
        <path d="M 450 178 Q 520 182 550 182 T 610 190" fill="none" stroke="#450A0A" stroke-width="3" filter="url(#glow-dark)"/>
        <path d="M 450 262 Q 520 258 550 258 T 610 250" fill="none" stroke="#450A0A" stroke-width="3" filter="url(#glow-dark)"/>
        
        <path d="M 450 178 A 7 42 0 0 0 450 262" stroke="rgba(0,0,0,0.3)" stroke-width="1.5" stroke-dasharray="2,2" fill="none"/>
        <path d="M 450 178 A 7 42 0 0 1 450 262" stroke="rgba(0,0,0,0.3)" stroke-width="1.5" fill="none"/>
        
        <line x1="540" y1="182" x2="540" y2="258" stroke="#EF4444" stroke-dasharray="2,2"/>
        <line x1="560" y1="182" x2="560" y2="258" stroke="#EF4444" stroke-dasharray="2,2"/>
        
        <text x="390" y="105" font-family="'Courier New', monospace" font-size="15" font-weight="bold" fill="#000000">V = ∫ π y² dx</text>
        
  </g>

  <!-- Desmos Logo overlay -->
  

  <!-- Bottom-Right Banner clipped by card rounded corner -->
  <g clip-path="url(#cardClip)">
    <path d="M 370,450 L 370,380 C 370,362 385,348 402,348 L 800,348 L 800,450 Z" fill="#000000"/>
    <text x="590" y="408" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="23" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.2">Solids of Revolution</text>
  </g>
</svg>