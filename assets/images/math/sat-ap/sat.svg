<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Silver Gradient for AP/SAT cards -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- IBO Logo Gradient -->
    <radialGradient id="ibLogoGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="70%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>

    <!-- Card Clipping Shape for Banner -->
    <clipPath id="cardClip">
      <rect x="0" y="0" width="800" height="450" rx="24"/>
    </clipPath>

    <!-- Technical Grid Pattern -->
    <pattern id="lightGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 0, 0, 0.03)" stroke-width="0.8"/>
    </pattern>

    <!-- Glow filter for curves -->
    <filter id="glow-dark" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="context-stroke" />
    </marker>
    
  </defs>

  <!-- Card Background -->
  <rect width="800" height="450" rx="24" fill="url(#silverGrad)" stroke="rgba(0,0,0,0.06)" stroke-width="2"/>
  <rect width="800" height="450" rx="24" fill="url(#lightGrid)"/>

  <!-- Logo Placement -->
  
    <g transform="translate(70, 395)">
      <path d="M -8,0 C -8,-2.5 -4.5,-4.5 0,-4.5 C 4.5,-4.5 8,-2.5 8,0 C 8,1.5 4.5,2.5 0,2.5 C -4.5,2.5 -8,1.5 -8,0 Z" fill="#475569"/>
      <path d="M -8,0 C -8,-5 -4.5,-9.5 0,-9.5 C 4.5,-9.5 8,-5 8,0 C 8,5.5 1.5,10.5 0,11.5 C -1.5,10.5 -8,5.5 -8,0 Z" fill="#1E293B" stroke="#FFFFFF" stroke-width="0.5"/>
      <path d="M -8,0 C -8,-2.5 -4.5,-4.5 0,-4.5 C 4.5,-4.5 8,-2.5 8,0 C 8,1.5 4.5,2.5 0,2.5 C -4.5,2.5 -8,1.5 -8,0 Z" fill="#475569" stroke="#FFFFFF" stroke-width="0.5"/>
      <path d="M 0,-9.5 L 0,-13" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
      <text x="16" y="8" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="20" fill="#1E293B" letter-spacing="-0.8">College Board</text>
    </g>
    

  <!-- AP/SAT Badges -->
  
  <!-- AP and SAT shields in top right -->
  <g transform="translate(680, 50)">
    <g transform="translate(-40, 0)">
      <path d="M -15,-15 L 15,-15 L 15,2 C 15,9 8,16 0,20 C -8,16 -15,9 -15,2 Z" fill="#FFFFFF" stroke="#0079C1" stroke-width="1.5"/>
      <path d="M -13,-13 L 13,-13 L 13,2 C 13,8.5 6.5,14.5 0,18.5 C -6.5,14.5 -13,8.5 -13,2 Z" fill="#0079C1" opacity="0.1"/>
      <text x="0" y="4" font-family="'Inter', sans-serif" font-weight="900" font-size="13" fill="#0079C1" text-anchor="middle">AP</text>
    </g>
    <g transform="translate(0, 0)">
      <path d="M -15,-15 L 15,-15 L 15,2 C 15,9 8,16 0,20 C -8,16 -15,9 -15,2 Z" fill="#0079C1" stroke="#0079C1" stroke-width="1.5"/>
      <text x="0" y="4" font-family="'Inter', sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle">SAT</text>
    </g>
  </g>


  <!-- Left Content Panel -->
  <g transform="translate(60, 0)">
    <!-- Title Line 1 -->
    <text x="0" y="140" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#000000" letter-spacing="-1">Digital SAT</text>
    
    <!-- Title Line 2 -->
    <text x="0" y="210" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="38" fill="#000000" letter-spacing="-0.5">Mathematics</text>
    
    <!-- Subtitle (Curriculum name / Board / Level) -->
    <text x="0" y="260" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="20" fill="#334155" letter-spacing="-0.2">The College Board</text>
  </g>

  <!-- Right Illustration Panel -->
  <g transform="translate(0, 0)">
    
        <!-- Desmos screen on card -->
        <g transform="translate(420, 100)">
          <rect x="0" y="0" width="220" height="140" rx="8" fill="#030712" stroke="rgba(0,0,0,0.3)" stroke-width="2"/>
          <rect x="0" y="0" width="220" height="140" rx="8" fill="none" stroke="#EF4444" stroke-width="1.5" filter="url(#glow-dark)"/>
          
          <line x1="80" y1="0" x2="80" y2="140" stroke="rgba(255,255,255,0.15)"/>
          <g transform="translate(6, 12)" fill="#F87171" font-family="'Courier New', monospace" font-size="8.5" font-weight="bold">
            <circle cx="4" cy="15" r="3.5" fill="#EF4444"/>
            <text x="12" y="18">y = -2x + 4</text>
            <circle cx="4" cy="40" r="3.5" fill="#60A5FA"/>
            <text x="12" y="43">y = x² - 2</text>
          </g>
          
          <g transform="translate(150, 70)" stroke="rgba(255,255,255,0.1)" stroke-width="0.7">
            <line x1="-65" y1="0" x2="60" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
            <line x1="0" y1="-60" x2="0" y2="60" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
            
            <line x1="-50" y1="25" x2="50" y2="-25" stroke="#EF4444" stroke-width="2.5" filter="url(#glow-dark)"/>
            <path d="M -45 -10 Q 0 35 45 -10" fill="none" stroke="#60A5FA" stroke-width="2" />
            <circle cx="22" cy="-11" r="4" fill="#FFFFFF" stroke="none"/>
          </g>
        </g>
        
  </g>

  <!-- Desmos Logo overlay -->
  
  <!-- Desmos green logo -->
  <g transform="translate(685, 275)">
    <rect x="0" y="0" width="55" height="55" rx="13" fill="#1A7F37" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <path d="M 12 15 C 20 40, 35 40, 43 15" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 10 35 Q 20 22, 27.5 35 T 45 35" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <text x="27.5" y="48" font-family="'Inter', sans-serif" font-weight="900" font-size="6.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.2">desmos</text>
  </g>


  <!-- Bottom-Right Banner clipped by card rounded corner -->
  <g clip-path="url(#cardClip)">
    <path d="M 370,450 L 370,380 C 370,362 385,348 402,348 L 800,348 L 800,450 Z" fill="#000000"/>
    <text x="590" y="408" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="23" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.2">Desmos Graphing</text>
  </g>
</svg>