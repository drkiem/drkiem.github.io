<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Silver Gradient for AP/SAT cards -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- IBO Logo Gradient -->
    <radialGradient id="ibLogoGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="70%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>

    <!-- Card Clipping Shape for Banner -->
    <clipPath id="cardClip">
      <rect x="0" y="0" width="800" height="450" rx="24"/>
    </clipPath>

    <!-- Technical Grid Pattern -->
    <pattern id="lightGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 0, 0, 0.03)" stroke-width="0.8"/>
    </pattern>

    <!-- Glow filter for curves -->
    <filter id="glow-dark" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="context-stroke" />
    </marker>
    
  </defs>

  <!-- Card Background -->
  <rect width="800" height="450" rx="24" fill="#E2E8F0" stroke="rgba(0,0,0,0.06)" stroke-width="2"/>
  <rect width="800" height="450" rx="24" fill="url(#lightGrid)"/>

  <!-- Logo Placement -->
  
    <g transform="translate(570, 50)">
      <polygon points="0,-15 13,-7 13,7 0,15 -13,7 -13,-7" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.2"/>
      <text x="0" y="3.5" font-family="'Inter', sans-serif" font-weight="900" font-size="8.5" fill="#FFFFFF" text-anchor="middle">CC</text>
      <g transform="translate(20, -6)">
        <text x="0" y="8" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="12" fill="#0F172A" letter-spacing="-0.5">Common Core</text>
        <text x="0" y="20" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="11" fill="#475569" letter-spacing="-0.2">State Standards</text>
      </g>
    </g>
    

  <!-- AP/SAT Badges -->
  

  <!-- Left Content Panel -->
  <g transform="translate(60, 0)">
    <!-- Title Line 1 -->
    <text x="0" y="140" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#000000" letter-spacing="-1">Math Grade 6-8</text>
    
    <!-- Title Line 2 -->
    <text x="0" y="210" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="38" fill="#000000" letter-spacing="-0.5">Common Core</text>
    
    <!-- Subtitle (Curriculum name / Board / Level) -->
    <text x="0" y="260" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="20" fill="#334155" letter-spacing="-0.2">CCSS Standards</text>
  </g>

  <!-- Right Illustration Panel -->
  <g transform="translate(0, 0)">
    
        <!-- fractions bar and cylinder -->
        <g transform="translate(380, 115)" stroke="rgba(0,0,0,0.3)" stroke-width="1.5" fill="none">
          <rect x="0" y="0" width="130" height="22" rx="3" />
          <rect x="0" y="0" width="26" height="22" fill="#4B5563" opacity="0.3" stroke="none"/>
          <rect x="26" y="0" width="26" height="22" fill="#4B5563" opacity="0.3" stroke="none"/>
          <line x1="26" y1="0" x2="26" y2="22" />
          <line x1="52" y1="0" x2="52" y2="22" />
          <line x1="78" y1="0" x2="78" y2="22" />
          <line x1="104" y1="0" x2="104" y2="22" />
        </g>
        
        <g transform="translate(565, 120)" stroke="rgba(0,0,0,0.2)" stroke-width="1" fill="none">
          <line x1="0" y1="90" x2="90" y2="90" />
          <line x1="10" y1="10" x2="10" y2="100" />
          <line x1="10" y1="90" x2="80" y2="20" stroke="#1F2937" stroke-width="2.5" filter="url(#glow-dark)"/>
        </g>
        
        <g transform="translate(485, 215)" stroke="rgba(0,0,0,0.4)" stroke-width="1.5" fill="none">
          <ellipse cx="0" cy="0" rx="30" ry="9" stroke="#1F2937" stroke-width="2" filter="url(#glow-dark)"/>
          <line x1="-30" y1="0" x2="-30" y2="55" />
          <line x1="30" y1="0" x2="30" y2="55" />
          <path d="M -30,55 A 30,9 0 0 0 30,55" stroke="#1F2937" stroke-width="2" filter="url(#glow-dark)"/>
        </g>
        
  </g>

  <!-- Desmos Logo overlay -->
  

  <!-- Bottom-Right Banner clipped by card rounded corner -->
  <g clip-path="url(#cardClip)">
    <path d="M 370,450 L 370,380 C 370,362 385,348 402,348 L 800,348 L 800,450 Z" fill="#1E293B"/>
    <text x="590" y="408" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="23" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.2">Middle School Math</text>
  </g>
</svg>