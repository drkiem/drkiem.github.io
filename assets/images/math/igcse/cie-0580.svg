<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Silver Gradient for AP/SAT cards -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- IBO Logo Gradient -->
    <radialGradient id="ibLogoGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="70%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>

    <!-- Card Clipping Shape for Banner -->
    <clipPath id="cardClip">
      <rect x="0" y="0" width="800" height="450" rx="24"/>
    </clipPath>

    <!-- Technical Grid Pattern -->
    <pattern id="lightGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 0, 0, 0.03)" stroke-width="0.8"/>
    </pattern>

    <!-- Glow filter for curves -->
    <filter id="glow-dark" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="context-stroke" />
    </marker>
    
  </defs>

  <!-- Card Background -->
  <rect width="800" height="450" rx="24" fill="#E2F0D9" stroke="rgba(0,0,0,0.06)" stroke-width="2"/>
  <rect width="800" height="450" rx="24" fill="url(#lightGrid)"/>

  <!-- Logo Placement -->
  
    <g transform="translate(520, 50)">
      <path d="M -15,-15 L 15,-15 L 15,0 C 15,9 8,16 0,20 C -8,16 -15,9 -15,0 Z" fill="#A80000" stroke="#FFFFFF" stroke-width="1.2"/>
      <line x1="-15" y1="-2" x2="15" y2="-2" stroke="#FFFFFF" stroke-width="3"/>
      <line x1="-1" y1="-15" x2="-1" y2="20" stroke="#FFFFFF" stroke-width="3"/>
      <line x1="-15" y1="-2" x2="15" y2="-2" stroke="#A80000" stroke-width="0.6"/>
      <line x1="-1" y1="-15" x2="-1" y2="20" stroke="#A80000" stroke-width="0.6"/>
      <circle cx="-8" cy="-8.5" r="2.2" fill="#EAB308"/>
      <circle cx="6" cy="-8.5" r="2.2" fill="#EAB308"/>
      <circle cx="-8" cy="7.5" r="2.2" fill="#EAB308"/>
      <circle cx="6" cy="7.5" r="2.2" fill="#EAB308"/>
      <rect x="-3.5" y="-4.5" width="5" height="5" fill="#EAB308" rx="0.5"/>
      <g transform="translate(25, -6)">
        <text x="0" y="8" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="11.5" fill="#1E293B" letter-spacing="-0.1">Cambridge Assessment</text>
        <text x="0" y="20" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="10.5" fill="#475569">International Education</text>
      </g>
    </g>
    

  <!-- AP/SAT Badges -->
  

  <!-- Left Content Panel -->
  <g transform="translate(60, 0)">
    <!-- Title Line 1 -->
    <text x="0" y="140" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#000000" letter-spacing="-1">IGCSE</text>
    
    <!-- Title Line 2 -->
    <text x="0" y="210" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="38" fill="#000000" letter-spacing="-0.5">Mathematics</text>
    
    <!-- Subtitle (Curriculum name / Board / Level) -->
    <text x="0" y="260" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="20" fill="#334155" letter-spacing="-0.2">Cambridge 0580</text>
  </g>

  <!-- Right Illustration Panel -->
  <g transform="translate(0, 0)">
    
        <!-- circle geometry and simultaneous eq -->
        <g transform="translate(460, 185)" stroke="rgba(0,0,0,0.3)" stroke-width="1.8" fill="none">
          <circle cx="0" cy="0" r="55" stroke="#115E59" stroke-width="3" filter="url(#glow-dark)"/>
          <circle cx="0" cy="0" r="3" fill="#000000" stroke="none"/>
          <polygon points="-47.6,27.5 0,-55 47.6,27.5" stroke="rgba(0,0,0,0.5)" stroke-width="1.5"/>
          <line x1="-47.6" y1="27.5" x2="0" y2="0" stroke="rgba(0,0,0,0.3)"/>
          <line x1="47.6" y1="27.5" x2="0" y2="0" stroke="rgba(0,0,0,0.3)"/>
          
          <path d="M -8 5 A 10 10 0 0 0 8 5" stroke="#0EA5E9" stroke-width="1.5"/>
          <text x="0" y="-4" font-family="'Inter', sans-serif" font-size="9" fill="#0EA5E9" stroke="none" text-anchor="middle">2θ</text>
        </g>
        
        <g transform="translate(570, 130)" fill="#115E59" font-family="'Courier New', monospace" font-size="15" font-weight="bold" filter="url(#glow-dark)">
          <text x="0" y="25">{ 3x + 2y = 12</text>
          <text x="0" y="50">{  x -  y = 4</text>
        </g>
        
  </g>

  <!-- Desmos Logo overlay -->
  

  <!-- Bottom-Right Banner clipped by card rounded corner -->
  <g clip-path="url(#cardClip)">
    <path d="M 370,450 L 370,380 C 370,362 385,348 402,348 L 800,348 L 800,450 Z" fill="#0F3D59"/>
    <text x="590" y="408" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="23" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.2">Paper 2 &amp; 4</text>
  </g>
</svg>